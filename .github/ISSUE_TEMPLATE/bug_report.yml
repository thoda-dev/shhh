name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag you run, or the commit if you build from source.
      placeholder: "thodadev/shhh:1.0.1"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose, bundled PostgreSQL
        - Docker Compose, external PostgreSQL
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a paste with a max read count of 1
        2. Open the link twice
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker compose logs app`. Redact anything sensitive — this issue is public."
      render: shell
